name: Publish v0.4.5

on:
  push:
    paths:
      - .github/workflows/publish-v0.4.5.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply release changes
        run: python .github/publish_v045.py

      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon

      - name: Commit release
        id: release_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_devices.py apps/pool_manager/pool_control.py tests/test_pump_command_policy.py CHANGELOG.md
          git commit -m "release: v0.4.5 manual pump speed handoff"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Pool Manager now avoids repeatedly rewriting an unchanged pump-speed target, making manual speed adjustments possible without disabling the whole filtration strategy.

          - Normal pump control compares the requested target with the last command emitted by Pool Manager.
          - If the automatic target is unchanged, a manual Home Assistant/Aquagem speed adjustment is left alone.
          - When the automatic target changes, Pool Manager resumes control from the real reported `fan.percentage` and keeps the existing ramp/delay limits.
          - The normal `Température` path no longer forces the same speed again on each periodic evaluation.
          - Startup, PAC minimum-flow and freeze/safety paths keep their forced commands.
          - No YAML migration is required.

          This remains generic Home Assistant `fan` control; no Aquagem-specific dependency was added.
          EOF
          gh release create v0.4.5 --target "$RELEASE_SHA" --title "v0.4.5 - Manual pump speed handoff" --notes-file /tmp/release-notes.md

      - name: Remove one-shot publisher
        run: |
          git pull --rebase origin main
          git rm .github/workflows/publish-v0.4.5.yml .github/publish_v045.py
          git commit -m "chore: remove v0.4.5 publisher"
          git push origin HEAD:main
