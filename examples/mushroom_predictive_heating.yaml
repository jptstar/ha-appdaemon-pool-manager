# Compact Mushroom dashboard example for v0.7 predictive heating.
# Replace sensor.pool_predictive_heating if you configured another entity id.

type: custom:mushroom-template-card
entity: sensor.pool_predictive_heating
primary: >-
  {% set e = 'sensor.pool_predictive_heating' %}
  {{ states(e) }}
secondary: >-
  {% set e = 'sensor.pool_predictive_heating' %}
  {% set swim = state_attr(e, 'next_swim_date') %}
  {% set start = state_attr(e, 'recovery_start_date') %}
  {% set preset = state_attr(e, 'recommended_preset') %}
  {% set water = state_attr(e, 'water_temperature') %}
  {% set target = state_attr(e, 'target_temperature') %}
  {% set night = state_attr(e, 'night_heating_allowed') %}
  {% if water is not none and target is not none %}
  🌡️ {{ water }} → {{ target }} °C
  {% endif %}
  {% if swim %}
   · 🏊 {{ swim }}{% if start %} · préchauffe {{ start }}{% endif %}
  {% else %}
   · ⏸ pas de journée retenue
  {% endif %}
  {% if state_attr(e, 'heating_now') %}
   · 🔥 {{ preset or 'Smart' }}{% if night %} · nuit autorisée{% endif %}
  {% endif %}
icon: mdi:pool-thermometer
icon_color: >-
  {% set e = 'sensor.pool_predictive_heating' %}
  {% if state_attr(e, 'heating_now') %}
    red
  {% elif state_attr(e, 'next_swim_date') %}
    blue
  {% else %}
    grey
  {% endif %}
multiline_secondary: false
tap_action:
  action: more-info
