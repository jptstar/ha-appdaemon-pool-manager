name: Publish v0.4.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 already exists"
            exit 0
          fi
          gh release create v0.4.0 \
            --target 82a5922a6dcfe43a870adf512ab1f2e4c230fa6a \
            --title "v0.4.0 - Daylight-aware Intelligent mode" \
            --notes-file - <<'EOF'
          ## Pool Manager v0.4.0

          Intelligent filtration is now planned around the real daylight period and a representative stored pool-water temperature.

          ### Daylight-aware filtration
          - Uses AppDaemon sunrise/sunset for the main Intelligent filtration window when available.
          - Keeps the configured fixed solar hours as an automatic fallback.
          - Paces expected daily filtration across real daylight instead of a fixed 09:00-18:00 period.
          - Prevents a large grid export from starting solar filtration before sunrise.
          - Evening catch-up starts after real sunset and keeps the existing configured deadline.

          ### Thermal reference
          - Reuses the existing `mem_temp` helper; no new Home Assistant helper is required.
          - While the pump is stopped, the daily target starts from the persisted representative temperature.
          - After sufficient circulation, the live target immediately uses the real water temperature.
          - The stored reference is then updated progressively from valid physical measurements only.
          - Fail-safe substituted temperatures are never averaged into the thermal reference.

          ### Night mixing / freeze protection
          - Periodic night mixing is disabled by default in `Intelligent` mode because it is no longer needed just to refresh water temperature.
          - `Hors Gel` periodic circulation and adaptive continuous freeze protection remain completely independent and unchanged.

          No Home Assistant automation change is required for this update. PAC automatic takeover and adaptive freeze protection remain separate opt-in features.
          EOF
