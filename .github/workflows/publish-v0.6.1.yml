name: Publish v0.6.1

on:
  push:
    paths:
      - .github/workflows/publish-v0.6.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Pool Manager v0.6.1 extends predictive heating with a 15-day strategic weather outlook while keeping actual heating commitment close to the bathing date.

          - Reads up to 15 daily forecast days when the configured Home Assistant weather provider supplies them.
          - Adds distance-confidence tiers: J0–J3 strong, J4–J7 medium, J8–J10 trend, J11–J15 indicative.
          - Keeps the original bathing score and adds a distance-weighted `strategic_score`, `horizon_weight` and `confidence` for diagnostics.
          - Adds `chauffage_predictif_horizon_operationnel_jours` (default 3): full comfort recovery is not scheduled for distant forecast opportunities until they enter the operational horizon.
          - Distant opportunities can still inform the strategy and dashboard while reserve-floor maintenance remains available when needed.
          - The predictive Home Assistant sensor now exposes forecast/operational horizons, next-swim confidence and the new per-day strategic fields.
          - Mushroom example now supports up to 15 forecast rows.
          - Existing v0.6 configurations remain compatible; set `chauffage_predictif_horizon_jours: 15` to use the full range when an existing configuration explicitly set 10 days.

          Safety priorities are unchanged: forced stop, Hors Gel, pump-first PAC flow confirmation, PAC flow fail-safe and post-circulation remain above predictive decisions.
          EOF
          gh release create v0.6.1 \
            --target 512d244874cf9c807642ccb73bb775fe58645f8a \
            --title "v0.6.1 - 15-day strategic weather outlook" \
            --notes-file /tmp/release-notes.md
