name: Publish v0.3.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo "v0.3.1 already exists"
            exit 0
          fi
          gh release create v0.3.1 \
            --target 3aff9e69abf1a53285f6d8e95eeec364a87e6269 \
            --title "v0.3.1 - Cold-water chlorination protection" \
            --notes-file - <<'EOF'
          ## Pool Manager v0.3.1

          This release protects the chlorinator cell when pool water is cold or its physical temperature reading is unavailable.

          - Electrolysis is inhibited at or below **15 °C** by default.
          - Production is released again only at or above **16 °C**, providing 1 °C hysteresis.
          - An `unknown` or `unavailable` real water-temperature entity immediately inhibits electrolysis.
          - The filtration fail-safe remains independent: filtration may use memory/last-valid/fallback temperature, while chlorination requires a valid physical water-temperature reading.
          - Protection is enabled by default and uses the existing `temperature_eau` entity, so no Home Assistant automation change is required for this feature.
          - Optional settings: `protection_electrolyse_froid`, `electrolyse_temperature_arret_c`, `electrolyse_temperature_reprise_c`.

          PAC automatic takeover and adaptive freeze protection remain opt-in as introduced in v0.3.0.
          EOF
