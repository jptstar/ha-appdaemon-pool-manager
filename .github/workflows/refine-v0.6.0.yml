name: Refine v0.6.0

on:
  push:
    branches:
      - feat/v0.6.0-predictive-heating
    paths:
      - .github/refine_v060.py
      - .github/workflows/refine-v0.6.0.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-predictive-heating
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply v0.6.0 refinements
        run: python .github/refine_v060.py
      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon
      - name: Commit validated refinements
        run: |
          if git diff --quiet; then
            echo "No refinements"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_predictive.py \
                  apps/pool_manager/pool_predictive_runtime.py \
                  apps/pool_manager/pool_heating.py \
                  examples/filtration_piscine.yaml \
                  README.md CHANGELOG.md tests/test_predictive_heating.py
          git commit -m "feat: refine v0.6.0 predictive planning and diagnostics"
          git push origin HEAD:feat/v0.6.0-predictive-heating
