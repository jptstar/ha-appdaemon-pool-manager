# Home Assistant helper example for Pool Manager v0.6.0.
# Merge the relevant blocks into your existing package; do not load duplicate helpers.

input_select:
  piscine_chauffage:
    name: Chauffage piscine
    options:
      - "Désactivé"
      - "Automatique"
      - "Début de saison • Smart"
      - "Fin de saison • Smart"
      - "Turbo • 1 h"
      - "Turbo • 2 h"
      - "Turbo • 3 h"
      - "Turbo • 6 h"
      - "Turbo • 12 h"
      - "Turbo • 1 jour"
      - "Turbo • 2 jours"
      - "Turbo • 3 jours"
    icon: mdi:heat-pump

input_text:
  piscine_chauffage_precedent:
    name: Chauffage piscine précédent
    max: 50
    icon: mdi:backup-restore

timer:
  piscine_chauffage:
    name: Chauffage piscine
    restore: true
    icon: mdi:timer

# Optional for chauffage_fin_saison_hybride: true.
# Merge into your existing Home Assistant package; do not duplicate headings.
input_boolean:
  piscine_chauffage_saison_terminee:
    name: Piscine - Fin de saison confirmée
    icon: mdi:calendar-lock

input_datetime:
  piscine_chauffage_froid_depuis:
    name: Piscine - Froid continu depuis
    has_date: true
    has_time: true
    icon: mdi:thermometer-low

  piscine_chauffage_derogation_jusqua:
    name: Piscine - Dérogation chauffage jusqu'à
    has_date: true
    has_time: true
    icon: mdi:clock-check-outline

input_button:
  piscine_chauffage_derogation_24h:
    name: Piscine - Dérogation chauffage 24 h
    icon: mdi:clock-plus-outline
