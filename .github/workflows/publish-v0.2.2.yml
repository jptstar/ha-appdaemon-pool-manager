name: Publish v0.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd3e789235d2675f0f7f47fd9abbc29aeace4ecc

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 \
            --target bd3e789235d2675f0f7f47fd9abbc29aeace4ecc \
            --title "Pool Manager v0.2.2" \
            --notes "Adaptive filtration target and flow-relative equivalent hours.\n\n- Use temperature/2 up to 25°C, then a continuous mild exponential curve above 25°C.\n- At 31.1°C the nominal adaptive target is about 16 h 57 instead of reaching the 24 h cap with the former polynomial.\n- Keep the existing filtration coefficient and 24 h safety cap.\n- Count equivalent filtration from estimated relative hydraulic flow instead of raw pump speed percentage.\n- Keep the filtered-volume helper explicitly approximate; no physical flow-meter is assumed.\n- Preserve the v0.2.1 PAC/grid/solar arbitration.\n- Add regression tests for curve continuity, hot-water targets and variable-speed hydraulic accounting."