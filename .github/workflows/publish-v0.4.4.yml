name: Publish v0.4.4

on:
  push:
    paths:
      - ".github/workflows/publish-v0.4.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.4 >/dev/null 2>&1 || \
          gh release create v0.4.4 \
            --target bcf7910e7021feb9e4ae4a96ad109cb7c6833e64 \
            --title "v0.4.4 - Unified heating modes" \
            --notes "Pool Manager now supports one optional Home Assistant heating selector for all user-facing PAC strategies.\n\n- Automatique keeps the existing seasonal weather/time policy.\n- Première chauffe • Smart establishes pump flow first, heats to the PAC setpoint, then returns to Automatique.\n- Fin de saison • Smart bypasses the normal seasonal/time gate and keeps Heat/Smart plus minimum PAC circulation available 24/7 so the PAC thermostat can maintain the requested pool temperature through cool nights.\n- Turbo modes from 1 h to 3 days establish pump flow first, use Turbo, then restore the previous heating strategy.\n- Forced stop, Hors Gel and PAC flow fail-safe remain higher priority.\n- Legacy entity_derogation_chauffage remains supported when the new selector is not configured.\n\nMigration: configure entity_chauffage (and optionally entity_chauffage_timer/entity_chauffage_precedent), then retire the old Home Assistant PAC override automation after validation."
