pool_manager:
  module: filtration_piscine
  class: FiltrationPiscine

  # Main sensors
  temperature_eau: sensor.pool_water_temperature
  restitution_inst: sensor.grid_power

  # General mode / scheduling
  mode_de_fonctionnement: input_select.pool_operating_mode
  # Optional master switch for automatic policy. When configured, automatic
  # PAC regulation is suspended unless this entity is on. Explicit heating
  # modes (first heat, end of season, Turbo) remain intentional user commands.
  entity_mode_auto: input_boolean.pool_auto_mode
  h_pivot: input_datetime.pool_pivot_time
  duree_filtration_ete: input_number.pool_daily_filtration_target
  coef: input_number.pool_filtration_coefficient
  mode_calcul: input_boolean.pool_use_curve_calculation
  tempo_eau: input_number.pool_water_circulation_delay
  mem_temp: input_number.pool_water_temperature_memory
  arret_force: input_boolean.pool_force_stop

  # Thermal reference used while the pump is stopped. Once water has circulated
  # long enough, the live target uses the real probe immediately while mem_temp
  # is updated as a slow moving representative value for the next stop/night.
  temperature_reference_lissee: true
  temperature_reference_alpha: 0.35
  temperature_reference_min_update_s: 1800

  # Safety / fail-safe
  fail_safe_active: true
  temperature_eau_secours_c: 32
  entity_temperature_exterieure: sensor.outdoor_temperature
  entity_temperature_exterieure_moyenne_24h: sensor.outdoor_temperature_mean_24h
  entity_temperature_exterieure_moyenne_7j: sensor.outdoor_temperature_mean_7d

  # Freeze protection. Periodic circulation remains the normal Hors Gel mode.
  # If adaptive protection is enabled, <=1 °C forces continuous circulation;
  # it releases only above 3 °C. Loss of the outdoor sensor while in Hors Gel
  # also falls back to continuous circulation.
  duree_bras_hors_gel: input_number.pool_freeze_circulation_duration
  intervalle_bras_hors_gel: input_number.pool_freeze_circulation_interval
  hors_gel_adaptatif: false
  hors_gel_continu_on_c: 1.0
  hors_gel_continu_off_c: 3.0

  # Pump / variable-speed drive (for example provided by an Aquagem integration)
  cde_pompe: fan.pool_pump
  fan_variateur_pompe: fan.pool_pump

  # Optional local-panel handoff exposed by the pump integration.
  # Température / Marche Forcée: assist ON; Pool Manager sends the initial
  # target once, then the local panel may take over after the integration's
  # quiet timer expires. Intelligent / Hors Gel / Arrêt Forcé: assist OFF so
  # automatic/safety control remains authoritative.
  entity_pompe_local_panel_assist: switch.pool_pump_local_panel_assist
  entity_pompe_local_control_available: binary_sensor.pool_pump_local_panel_control_available
  entity_pompe_local_control_remaining: sensor.pool_pump_time_until_local_control

  message_filtration_piscine: input_text.pool_manager_status
  message_filtration_piscine_detail: input_text.pool_manager_status_detail
  entity_debug_w: input_text.pool_manager_power_debug

  # Heat pump (for example provided by an AstralPool integration)
  entity_pac_climate: climate.pool_heat_pump
  entity_pac_conso: sensor.pool_heat_pump_power
  entity_pompe_conso: sensor.pool_pump_power

  # v0.6.0: one selector controls the heating profile. Recommended options:
  # Désactivé / Automatique / Début de saison • Smart / Fin de saison • Smart /
  # Turbo • 1 h / 2 h / 3 h / 6 h / 12 h / 1 jour / 2 jours / 3 jours.
  # The old `Première chauffe • Smart` wording is still accepted for migration.
  entity_chauffage: input_select.pool_heating

  entity_chauffage_timer: timer.pool_heating
  entity_chauffage_precedent: input_text.pool_heating_previous

  chauffage_preset_auto: Smart
  chauffage_preset_smart: Smart
  chauffage_preset_turbo: Turbo
  chauffage_debut_saison_marge_c: 0.3

  # v0.7 self-learning predictive heating. The same engine is used in
  # Automatique and Fin de saison • Smart.
  chauffage_predictif: false
  entity_meteo_chauffage_predictif: weather.home

  # Optional virtual sensor published by AppDaemon for dashboard use.
  # No Home Assistant helper is required; choose a unique sensor entity id.
  entity_chauffage_predictif_status: sensor.pool_predictive_heating

  # Weather outlook. Up to 15 days remain visible; heating only starts when the
  # learned thermal model says recovery really needs to begin.
  chauffage_predictif_horizon_jours: 15
  chauffage_predictif_prevision_refresh_s: 1800
  chauffage_predictif_prevision_max_age_s: 21600

  # Bathing-day score: outdoor temperature + sun/clouds - rain - wind.
  chauffage_predictif_temperature_baignade_min_c: 21
  chauffage_predictif_temperature_baignade_ideale_c: 26
  chauffage_predictif_score_baignade_min: 55

  # Initial fallback only. Pool Manager learns real °C/h separately for each
  # PAC preset (Smart, Turbo, etc.) and outdoor-temperature range.
  chauffage_predictif_gain_chauffe_c_par_h: 0.30

  # Initial passive-night-loss fallback at ΔT water/air = 10 °C.
  # Real night losses are learned automatically, including cover state.
  chauffage_predictif_perte_nuit_delta10_c_par_h: 0.05

  chauffage_predictif_apprentissage: true
  chauffage_predictif_apprentissage_min_s: 1800
  chauffage_predictif_apprentissage_alpha: 0.25

  # Certified water measurement used by learning and important heat decisions.
  # Stabilization is shared with the normal pump-start delay (tempo_eau).
  # Predictive sampling never starts an autonomous circulation cycle and never
  # overrides pump speed merely to obtain a temperature.
  chauffage_predictif_mesure_fraiche_s: 21600

  # During a long PAC run, request another certified sample every 2 hours so
  # Smart/Turbo gain and electrical power continue to learn automatically.
  chauffage_predictif_mesure_intervalle_chauffe_s: 7200

  # If normal filtration is already running, certify a morning decision when a
  # selected bathing opportunity is within this many days. The controller does
  # not start the pump merely to measure when the current decision is WAIT.
  chauffage_predictif_mesure_anticipation_jours: 3

  # Daily thermal capacity assumptions before enough installation data exists.
  # The planner makes a daily WAIT/PRESERVE/PREHEAT/MAINTAIN decision; these are
  # capacity envelopes, not fixed heating schedules.
  chauffage_predictif_heures_chauffe_jour: 12
  chauffage_predictif_heures_jour_baignade: 6

  # The real cover entity is used for learning. For future overnight forecasts,
  # assume the cover is normally closed even if it is currently open in daytime.
  chauffage_predictif_volet_nuit_prevu: closed

  # Optional absolute recoverability floor. When set, the water will not be
  # deliberately allowed below this temperature, even through a long bad spell.
  # chauffage_predictif_temperature_min_eau_c: 22

  # Compatibility fallback when no absolute minimum is configured.
  chauffage_predictif_plancher_auto_delta_c: 2.0
  chauffage_predictif_plancher_fin_saison_delta_c: 4.0
  chauffage_predictif_recharge_plancher_c: 0.5
  chauffage_predictif_marge_arret_c: 0.2

  # Learning is persisted automatically one level above the HACS package.
  # Override only if your AppDaemon filesystem requires another writable path.
  # chauffage_predictif_learning_file: /config/appdaemon/pool_manager_thermal_learning.json

  # v0.5 fin_saison_* names remain accepted as migration aliases where useful.
  # The old bathing-hour / fixed heating-window scheduler is intentionally gone.

  # Legacy v0.2.x-v0.4.3 compatibility only. Do not configure this together with
  # a new HA automation that also controls the v0.4.4 selector.
  # entity_derogation_chauffage: input_boolean.pool_heating_override

  seuil_pac_veille_w: 200
  seuil_pac_silent_w: 500
  seuil_pac_smart_w: 1200
  seuil_pac_turbo_w: 1900
  vitesse_min_pac_active: 47
  marge_temp_pac_c: 0.3

  # PAC automatic seasonal policy (opt-in for backwards compatibility).
  # Start sequence is always: pump -> >= minimum speed -> climate Heat.
  # Stop sequence is: climate Off -> post-circulation -> normal pump strategy.
  # When entity_mode_auto is configured, only the Automatique strategy is gated.
  gestion_pac_auto: false
  heure_debut_pac_auto: "08:00:00"
  heure_fin_pac_auto: "20:00:00"
  pac_auto_demarrage_ambiante_c: 25
  pac_auto_demarrage_24h_c: 19
  pac_auto_demarrage_7j_c: 18
  pac_auto_arret_ambiante_c: 21
  pac_auto_arret_24h_c: 18
  pac_auto_arret_7j_c: 17
  pac_auto_timeout_capteurs_s: 900
  pac_auto_timeout_demarrage_s: 30
  pac_post_circulation_s: 60
  pac_flow_fail_timeout_s: 15
  pac_flow_active_w: 200

  pac_priorite_soleil: true
  heure_debut_pac_soleil: "10:00:00"
  heure_fin_pac_soleil: "17:30:00"
  pac_import_max_jour_w: 300
  pac_tempo_anti_coupure_jour: 900
  pac_maintien_jour_force: true

  pac_prioritaire_absolue: true
  vitesse_pac_prioritaire: 47

  # Daily quota
  garantir_quota_journalier: true
  heure_limite_quota_journalier: "22:00:00"
  vitesse_min_garantie_quota: 47
  vitesse_max_garantie_quota: 100

  entity_volume_filtre_jour: input_number.pool_filtered_volume_today
  entity_temps_filtration_equivalent_jour: input_number.pool_equivalent_filtration_today
  entity_date_cumul: input_text.pool_daily_counter_date

  # Hydraulic model
  debit_max_pompe_m3h: 16
  debit_min_filtration_utile_m3h: 8
  volume_piscine_m3: 48

  # Pump speeds
  vitesse_mode_temperature: 70
  vitesse_reference_filtration: 70
  vitesse_min_filtration_utile: 47
  vitesse_min_solaire: 47
  vitesse_max_solaire: 100
  vitesse_rattrapage: 50
  vitesse_min_rattrapage: 47
  vitesse_rattrapage_palier_2: 55
  vitesse_rattrapage_palier_3: 70
  vitesse_rattrapage_palier_4: 85
  vitesse_max_complement_soir: 70
  vitesse_brassage_nuit: 35

  # Intelligent mode no longer needs periodic night mixing just to refresh the
  # water temperature. This does NOT disable periodic/continuous Hors Gel.
  brassage_nuit_intelligent: false

  vitesse_max_maintien_faible: 60
  vitesse_max_maintien_faible_pac: 75
  vitesse_max_rattrapage_surplus_faible: 70

  # Solar management. When suivre_soleil_reel is enabled, AppDaemon sunrise /
  # sunset define the Intelligent filtration window. The fixed 09:00-18:00
  # values remain the automatic fallback if sun data cannot be obtained.
  suivre_soleil_reel: true
  marge_apres_lever_soleil_min: 0
  marge_avant_coucher_soleil_min: 0
  seuil_surplus_demarrage_w: 500
  seuil_surplus_arret_w: 250
  surplus_max_w: 900
  marge_surplus_securite: 50
  tempo_min_on_solaire: 900
  tempo_min_off_solaire: 600
  tempo_anti_coupure_solaire: 180
  tempo_stabilite_surplus: 180
  heure_debut_solaire: "09:00:00"
  heure_fin_solaire: "18:00:00"
  heure_fin_rattrapage: "22:00:00"

  # Catch-up logic
  seuil_ratio_rattrapage_1: 0.05
  seuil_ratio_rattrapage_2: 0.10
  seuil_ratio_rattrapage_3: 0.20
  seuil_ratio_rattrapage_4: 0.30
  reste_min_complement_soir_h: 0.5
  avancement_min_sans_complement: 0.90

  # Variable-speed drive stability
  delta_vitesse_min: 5
  pas_vitesse_max: 10
  tempo_changement_vitesse: 30

  # Hybrid PID on net grid power
  pid_kp: 0.09
  pid_ki: 0.015
  pid_kd: 0.02
  pid_target_w: -30
  pid_deadband_w: 40
  pid_integral_min: -4000
  pid_integral_max: 4000
  pid_step_max: 5

  # Estimated pump power curve: [speed %, watts]
  points_puissance_pompe:
    - [11, 150]
    - [23, 200]
    - [35, 262]
    - [47, 327]
    - [52, 386]
    - [58, 432]
    - [64, 483]
    - [70, 544]
    - [76, 584]
    - [82, 658]
    - [88, 743]
    - [94, 828]
    - [100, 884]

  # Chlorination
  entity_volet_piscine: cover.pool_cover
  entity_consigne_electrolyseur: number.pool_chlorinator_production
  entity_consigne_electrolyseur_volet_ouvert: input_number.pool_chlorination_cover_open
  entity_consigne_electrolyseur_volet_ferme: input_number.pool_chlorination_cover_closed
  consigne_electrolyseur_volet_ouvert_defaut: 90
  consigne_electrolyseur_volet_ferme_defaut: 70
  consigne_electrolyseur_arret: 0
  tempo_arret_electrolyseur_s: 10
  timeout_electrolyseur_force_s: 3
  seuil_vitesse_electrolyseur_pct: 47

  # Cold-water cell protection is enabled by default even if these lines are
  # omitted. <=15 °C stops electrolysis; >=16 °C allows it again. If the real
  # water-temperature entity is unavailable, electrolysis is inhibited.
  protection_electrolyse_froid: true
  electrolyse_temperature_arret_c: 15.0
  electrolyse_temperature_reprise_c: 16.0