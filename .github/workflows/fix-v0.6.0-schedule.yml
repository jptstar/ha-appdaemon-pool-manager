name: Fix v0.6.0 schedule

on:
  push:
    branches:
      - feat/v0.6.0-predictive-heating
    paths:
      - .github/fix_v060_schedule.py
      - .github/workflows/fix-v0.6.0-schedule.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-predictive-heating
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/fix_v060_schedule.py
      - name: Validate
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_predictive.py tests/test_predictive_heating.py
          git commit -m "fix: avoid overlapping predictive heating slots"
          git push origin HEAD:feat/v0.6.0-predictive-heating
