name: Build v0.6.0

on:
  push:
    branches:
      - feat/v0.6.0-predictive-heating
    paths:
      - .github/apply_v060.py
      - .github/workflows/build-v0.6.0.yml
      - apps/pool_manager/pool_predictive.py
      - apps/pool_manager/pool_predictive_runtime.py
      - tests/test_predictive_heating.py
      - tests/test_heating_modes.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-predictive-heating
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply v0.6.0 heating refactor
        run: python .github/apply_v060.py
      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_heating.py
          git commit -m "feat: v0.6.0 season-wide predictive heating"
          git push origin HEAD:feat/v0.6.0-predictive-heating
