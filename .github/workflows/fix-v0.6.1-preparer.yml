name: Fix v0.6.1 preparer

on:
  push:
    paths:
      - .github/workflows/fix-v0.6.1-preparer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix runtime patch logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prepare-v0.6.1.yml')
          text = path.read_text()
          start = text.index("          old_horizon = '''")
          end_marker = '''          replace_once(
              runtime,
              '            "next_swim_score": candidate.get("score"),'''
          end = text.index(end_marker, start)

          replacement = '''          runtime_text = Path(runtime).read_text()
          old = ''' + '"""' + '''        self.chauffage_predictif_horizon_jours = max(
            3,
            min(
                10,
                int(
                    float(
                        self._predictive_arg(
                            "chauffage_predictif_horizon_jours",
                            "fin_saison_horizon_jours",
                            10,
                        )
                    )
                ),
            ),
        )
''' + '"""' + '''
          new = ''' + '"""' + '''        self.chauffage_predictif_horizon_jours = max(
            3,
            min(
                15,
                int(
                    float(
                        self._predictive_arg(
                            "chauffage_predictif_horizon_jours",
                            "fin_saison_horizon_jours",
                            15,
                        )
                    )
                ),
            ),
        )
        self.chauffage_predictif_horizon_operationnel_jours = max(
            1,
            min(
                7,
                int(
                    float(
                        self.args.get(
                            "chauffage_predictif_horizon_operationnel_jours",
                            3,
                        )
                    )
                ),
            ),
        )
''' + '"""' + '''
          if runtime_text.count(old) != 1:
              raise RuntimeError(f"runtime horizon block count={runtime_text.count(old)}")
          Path(runtime).write_text(runtime_text.replace(old, new, 1))

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit preparer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prepare-v0.6.1.yml
          git commit -m "fix: v0.6.1 preparer runtime patch"
          git push origin HEAD:main

      - name: Remove fixer
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-v0.6.1-preparer.yml
          git commit -m "chore: remove v0.6.1 preparer fixer"
          git push origin HEAD:main
