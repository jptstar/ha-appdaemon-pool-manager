name: Build v0.5.0

on:
  push:
    paths:
      - .github/workflows/build-v0.5.0.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v0.5.0 changes
        run: python .github/apply_v050.py

      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_heating.py examples/filtration_piscine.yaml README.md CHANGELOG.md
          git commit -m "feat: v0.5.0 predictive end-season heating"
          git push origin HEAD:feat/v0.5.0-predictive-end-season
