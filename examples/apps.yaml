pool_manager:
  module: filtration_piscine
  class: FiltrationPiscine
  # Ready-by local hours. The historical single value remains the fallback.
  chauffage_predictif_heure_baignade: 15
  chauffage_predictif_heure_baignade_semaine: 17
  chauffage_predictif_heure_baignade_weekend: 12
  # Keep the predictive entity safely below Home Assistant's 16 KiB limit.
  chauffage_predictif_attributs_max_octets: 14000
  chauffage_predictif_marge_gain: 0.9
  pool_confirmation_enabled: true
  # Replace with your actual Companion notification service to enable mobile buttons.
  # Without it, a persistent HA notification + the optional dashboard card are available.
  # pool_notify_service: notify.mobile_app_your_phone

  # Main sensors
  temperature_eau: sensor.pool_water_temperature
  restitution_inst: sensor.grid_power
  # Optional separate positive import sensor. When configured, Pool Manager
  # calculates signed grid power as import minus restitution.
  entity_grid_import_power: sensor.grid_import_power
  # auto: entity ids containing restitution/export/injection are interpreted
  # as positive export; other sensors use positive import / negative export.
  # Set explicitly to net_signed or export_positive if the name is ambiguous.
  restitution_inst_mode: auto
  # Optional production value used by the power debug helper.
  entity_pv_power: sensor.solar_power

  # General mode / scheduling
  mode_de_fonctionnement: input_select.pool_operating_mode
  # Optional master automatic-policy gate. When configured, automatic PAC
  # regulation is suspended unless this entity is on.
  entity_mode_auto: input_boolean.pool_auto_mode
  h_pivot: input_datetime.pool_pivot_time
  duree_filtration_ete: input_number.pool_daily_filtration_target
  coef: input_number.pool_filtration_coefficient
  mode_calcul: input_boolean.pool_use_curve_calculation
  tempo_eau: input_number.pool_water_circulation_delay
  mem_temp: input_number.pool_water_temperature_memory
  arret_force: input_boolean.pool_force_stop

  # Freeze protection
  duree_bras_hors_gel: input_number.pool_freeze_circulation_duration
  intervalle_bras_hors_gel: input_number.pool_freeze_circulation_interval

  # Pump / variable-speed drive (for example provided by an Aquagem integration)
  cde_pompe: fan.pool_pump
  fan_variateur_pompe: fan.pool_pump

  # Optional but recommended with Aquagem Pump >= 0.4.2.
  # Intelligent / Hors Gel keep remote authority; Température / Marche Forcée
  # deliberately allow the physical panel to take over.
  entity_pompe_local_panel_assist: switch.pool_pump_return_to_local_control
  entity_pompe_local_control_available: binary_sensor.pool_pump_local_control_available
  entity_pompe_local_control_remaining: sensor.pool_pump_time_until_local_control

  # v0.8.1 protection: known Aquagem/iSaver fans are auto-protected even if the
  # switch above is omitted. Generic fan integrations can opt in explicitly.
  pompe_remote_keepalive: true
  pompe_remote_keepalive_s: 30

  message_filtration_piscine: input_text.pool_manager_status
  message_filtration_piscine_detail: input_text.pool_manager_status_detail
  entity_debug_w: input_text.pool_manager_power_debug

  # Heat pump (for example provided by an AstralPool integration)
  entity_pac_climate: climate.pool_heat_pump
  entity_pac_conso: sensor.pool_heat_pump_power
  entity_pompe_conso: sensor.pool_pump_power
  # Optional PAC diagnostics exposed on the predictive status entity.
  entity_pac_inlet_temperature: sensor.pool_heat_pump_inlet_temperature
  entity_pac_outlet_temperature: sensor.pool_heat_pump_outlet_temperature
  entity_pac_ambient_temperature: sensor.pool_heat_pump_ambient_temperature

  # Optional Home Assistant policy signal. HA owns the override timer/PAC mode;
  # Pool Manager treats this as a circulation demand.
  entity_derogation_chauffage: input_boolean.pool_heating_override

  seuil_pac_veille_w: 200
  seuil_pac_silent_w: 500
  seuil_pac_smart_w: 1200
  seuil_pac_turbo_w: 1900
  vitesse_min_pac_active: 47
  marge_temp_pac_c: 0.3

  # Adaptive predictive heating (v0.9.1: full-horizon MPC + protected calibration)
  chauffage_predictif: true
  chauffage_predictif_mpc: true
  entity_meteo_chauffage_predictif: weather.home
  entity_chauffage_predictif_status: sensor.pool_predictive_heating
  entity_chauffage_predictif_score: sensor.piscine_score_baignade
  chauffage_predictif_horizon_jours: 15
  chauffage_predictif_temperature_baignade_min_c: 21
  chauffage_predictif_temperature_baignade_ideale_c: 26
  chauffage_predictif_score_baignade_min: 55
  chauffage_predictif_bonus_weekend: 10

  # Absolute reserve only. MPC computes a warmer adaptive floor when needed.
  chauffage_predictif_temperature_min_eau_c: 22

  # Cold-start fallbacks; certified learning progressively replaces them.
  chauffage_predictif_gain_chauffe_c_par_h: 0.30
  chauffage_predictif_perte_nuit_delta10_c_par_h: 0.05
  chauffage_predictif_apprentissage: true
  # Stop the compressor after a complete learning interval, then certify mixed
  # water with pump-only circulation so local hot pipe water is never learned.
  chauffage_predictif_apprentissage_mesure_hors_pac: true

  # Certified water temperature: 70% is a temporary minimum. After tempo_eau,
  # the pipe probe must stay stable for 120 s within 0.15 °C. Normal energy
  # arbitration cannot stop an active calibration; safety/forced stop still can.
  chauffage_predictif_mesure_vitesse_pct: 70
  chauffage_predictif_mesure_stabilite_s: 120
  chauffage_predictif_mesure_variation_max_c: 0.15
  chauffage_predictif_mesure_fraiche_s: 21600
  chauffage_predictif_mesure_timeout_grace_s: 300
  chauffage_predictif_mesure_retry_s: 900

  # MPC search resolution and cold-start PAC power assumptions.
  chauffage_predictif_mpc_pas_h: 1.0
  chauffage_predictif_mpc_pas_temperature_c: 0.2
  chauffage_predictif_mpc_puissance_smart_w: 1200
  chauffage_predictif_mpc_puissance_turbo_w: 1900

  pac_priorite_soleil: true
  heure_debut_pac_soleil: "10:00:00"
  heure_fin_pac_soleil: "17:30:00"
  pac_import_max_jour_w: 300
  pac_tempo_anti_coupure_jour: 900
  # Compressor anti-short-cycle protection. The minimum run time starts when
  # physical PAC power confirms the compressor; safety/explicit stops stay immediate.
  pac_min_on_s: 900
  pac_min_off_s: 300
  # Keep circulation until PAC power has stayed low for 30 s (180 s maximum).
  pac_post_circulation_s: 60
  pac_post_circulation_stable_s: 30
  pac_post_circulation_max_s: 180
  pac_maintien_jour_force: true

  pac_prioritaire_absolue: true
  vitesse_pac_prioritaire: 47

  # Daily quota
  garantir_quota_journalier: true
  heure_limite_quota_journalier: "22:00:00"
  vitesse_min_garantie_quota: 47
  vitesse_max_garantie_quota: 100

  entity_volume_filtre_jour: input_number.pool_filtered_volume_today
  entity_temps_filtration_equivalent_jour: input_number.pool_equivalent_filtration_today
  entity_date_cumul: input_text.pool_daily_counter_date

  # Hydraulic model
  debit_max_pompe_m3h: 16
  debit_min_filtration_utile_m3h: 8
  volume_piscine_m3: 48

  # Pump speeds
  vitesse_mode_temperature: 70
  vitesse_reference_filtration: 70
  vitesse_min_filtration_utile: 47
  vitesse_min_solaire: 47
  vitesse_max_solaire: 100
  vitesse_rattrapage: 50
  vitesse_min_rattrapage: 47
  vitesse_rattrapage_palier_2: 55
  vitesse_rattrapage_palier_3: 70
  vitesse_rattrapage_palier_4: 85
  vitesse_max_complement_soir: 70
  vitesse_brassage_nuit: 35
  vitesse_max_maintien_faible: 60
  vitesse_max_maintien_faible_pac: 75
  vitesse_max_rattrapage_surplus_faible: 70

  # Solar management
  seuil_surplus_demarrage_w: 500
  seuil_surplus_arret_w: 250
  surplus_max_w: 900
  marge_surplus_securite: 50
  tempo_min_on_solaire: 900
  tempo_min_off_solaire: 600
  tempo_anti_coupure_solaire: 180
  tempo_stabilite_surplus: 180
  heure_debut_solaire: "09:00:00"
  heure_fin_solaire: "18:00:00"
  heure_fin_rattrapage: "22:00:00"

  # Catch-up logic
  seuil_ratio_rattrapage_1: 0.05
  seuil_ratio_rattrapage_2: 0.10
  seuil_ratio_rattrapage_3: 0.20
  seuil_ratio_rattrapage_4: 0.30
  reste_min_complement_soir_h: 0.5
  avancement_min_sans_complement: 0.90

  # Variable-speed drive stability
  delta_vitesse_min: 5
  pas_vitesse_max: 10
  tempo_changement_vitesse: 30

  # Hybrid PID on net grid power
  pid_kp: 0.09
  pid_ki: 0.015
  pid_kd: 0.02
  pid_target_w: -30
  pid_deadband_w: 40
  pid_integral_min: -4000
  pid_integral_max: 4000
  pid_step_max: 5

  # Estimated pump power curve: [speed %, watts]
  points_puissance_pompe:
    - [11, 150]
    - [23, 200]
    - [35, 262]
    - [47, 327]
    - [52, 386]
    - [58, 432]
    - [64, 483]
    - [70, 544]
    - [76, 584]
    - [82, 658]
    - [88, 743]
    - [94, 828]
    - [100, 884]

  # Chlorination
  entity_volet_piscine: cover.pool_cover
  entity_consigne_electrolyseur: number.pool_chlorinator_production
  entity_consigne_electrolyseur_volet_ouvert: input_number.pool_chlorination_cover_open
  entity_consigne_electrolyseur_volet_ferme: input_number.pool_chlorination_cover_closed
  consigne_electrolyseur_volet_ouvert_defaut: 90
  consigne_electrolyseur_volet_ferme_defaut: 70
  consigne_electrolyseur_arret: 0
  tempo_arret_electrolyseur_s: 10
  timeout_electrolyseur_force_s: 3
  seuil_vitesse_electrolyseur_pct: 47
