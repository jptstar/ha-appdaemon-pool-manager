name: Publish v0.4.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.4.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.2 >/dev/null 2>&1; then
            echo "v0.4.2 already exists"
            exit 0
          fi
          gh release create v0.4.2 \
            --target 429738fe772887cc3bfe4ea4a6a75845aea97ffe \
            --title "v0.4.2 - Compact status history" \
            --notes-file - <<'EOF'
          ## Pool Manager v0.4.2

          Reduce Home Assistant history noise from the detailed filtration status.

          - Timer countdown seconds are replaced by stable semantic states.
          - Instantaneous surplus/grid/PV/pump watt values are removed from the detail field and remain available in the dedicated debug field.
          - Daily need/completed/remaining quota and useful operating context are preserved.
          - Repeated semantic timer fragments are deduplicated.
          - Filtration, PAC, solar, quota and fail-safe control logic is unchanged.
          - No Home Assistant automation or YAML change is required.
          EOF
