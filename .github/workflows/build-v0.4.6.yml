name: Build v0.4.6

on:
  push:
    paths:
      - .github/workflows/build-v0.4.6.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply v0.4.6 changes
        run: python .github/apply_v046.py

      - name: Python validation
        run: |
          python -m pip install pytest
          python -m py_compile apps/pool_manager/*.py
          pytest -q

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: appdaemon

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pool_manager/pool_devices.py apps/pool_manager/pool_lifecycle.py apps/pool_manager/pool_control.py examples/filtration_piscine.yaml tests/test_pump_command_policy.py CHANGELOG.md
          git commit -m "fix: v0.4.6 mode-aware local pump control"
          git push origin HEAD:fix/v0.4.6-local-panel-policy
