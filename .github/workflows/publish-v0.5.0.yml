name: Publish v0.5.0

on:
  push:
    paths:
      - .github/workflows/publish-v0.5.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Predictive end-of-season heating turns `Fin de saison • Smart` into an optional weather-aware planner instead of keeping PAC circulation available 24/7.

          - Looks across Home Assistant daily weather forecasts, up to 10 days when the provider supplies them.
          - Scores bathing opportunities from forecast temperature, sun/cloud conditions, rain and wind.
          - Detects a good day followed by several poor days as a likely last bathing opportunity and adds scheduling margin.
          - Works backwards from the target bathing time and configured PAC heating rate to choose the latest safe heating start.
          - Avoids needless overnight heating when the following warm/sunny day still leaves enough daytime recovery time.
          - Starts earlier, including overnight, only when necessary to reach the requested water temperature before the bathing window.
          - When no credible bathing window exists, maintains only a configurable recovery floor instead of the full setpoint.
          - Forecasts are cached with bounded stale fallback during transient failures.
          - Forced stop, Hors Gel and PAC minimum-flow safety remain higher priority.
          - The feature is opt-in with `fin_saison_predictif: true`; existing v0.4.x end-of-season behavior remains unchanged by default.

          Home Assistant forecast responses are retrieved through `weather.get_forecasts`; AppDaemon 4.5+ is recommended for service-response support.
          EOF
          gh release create v0.5.0 --target b3025a7e418919d72244376e6f5cfc82fd07513a --title "v0.5.0 - Predictive end-of-season heating" --notes-file /tmp/release-notes.md

      - name: Remove one-shot publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm .github/workflows/publish-v0.5.0.yml
          git commit -m "chore: remove v0.5.0 publisher"
          git push origin HEAD:main
