name: Publish v0.4.6

on:
  push:
    paths:
      - .github/workflows/publish-v0.4.6.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Hotfix for pump-speed control and local-panel handoff.

          - Reverts the v0.4.5 last-command pump-speed ownership experiment after unexpected production speed behavior was observed.
          - Intelligent mode again regulates against the physical Home Assistant fan percentage and remains authoritative.
          - Température and Marche Forcée may enable the pump integration's local-panel assist when configured.
          - Température sends its configured speed once at mode/start initialization, then stops rewriting the same target so the physical panel can take over after the integration's quiet timer.
          - Marche Forcée keeps the running speed after startup and allows local takeover.
          - Intelligent, Hors Gel and Arrêt Forcé disable local-panel assist so automatic and safety control remain authoritative.
          - Startup, PAC minimum-flow, freeze protection and other explicit safety commands keep priority.

          New optional AppDaemon entities:
          - entity_pompe_local_panel_assist
          - entity_pompe_local_control_available
          - entity_pompe_local_control_remaining
          EOF
          gh release create v0.4.6 \
            --target 400fdee1add205ec8ecfa1128ad5999a6408cf7e \
            --title "v0.4.6 - Mode-aware local pump control" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm .github/workflows/publish-v0.4.6.yml
          git commit -m "chore: remove v0.4.6 publisher"
          git push origin HEAD:main
