name: Publish v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.1 >/dev/null 2>&1; then
            echo "v0.4.1 already exists"
            exit 0
          fi
          gh release create v0.4.1 \
            --target 36da88b4ffd720c5c1d1a477ba64b8f38c7b500d \
            --title "v0.4.1 - Cloudy-day catch-up fix" \
            --notes-file - <<'EOF'
          ## Pool Manager v0.4.1

          Fix for Intelligent mode on overcast days.

          - Daytime sanitary catch-up no longer requires >=500 W of stable PV surplus.
          - The 500 W threshold and stability timer remain mandatory for opportunistic solar-only starts.
          - Catch-up still requires daylight and cannot start before sunrise.
          - Existing quota, PAC, fail-safe, night-mixing and freeze-protection behavior is unchanged.
          - No Home Assistant automation change is required.
          EOF
