name: Fix v0.6.1 preparer

on:
  push:
    paths:
      - .github/workflows/fix-v0.6.1-preparer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix runtime patch logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prepare-v0.6.1.yml')
          text = path.read_text()
          needle = '          replace_once(runtime, old_horizon, new_horizon)\n'
          if text.count(needle) != 1:
              raise RuntimeError(f'preparer needle count={text.count(needle)}')

          lines = [
              '          runtime_text = Path(runtime).read_text()',
              '          start_marker = "        self.chauffage_predictif_horizon_jours = max(\\n"',
              '          end_marker = "        self.chauffage_predictif_prevision_refresh_s = max(\\n"',
              '          start = runtime_text.index(start_marker)',
              '          end = runtime_text.index(end_marker, start)',
              '          block_lines = [',
              '              "        self.chauffage_predictif_horizon_jours = max(",',
              '              "            3,",',
              '              "            min(",',
              '              "                15,",',
              '              "                int(",',
              '              "                    float(",',
              '              "                        self._predictive_arg(",',
              '              "                            \\\"chauffage_predictif_horizon_jours\\\",",',
              '              "                            \\\"fin_saison_horizon_jours\\\",",',
              '              "                            15,",',
              '              "                        )",',
              '              "                    )",',
              '              "                ),",',
              '              "            ),",',
              '              "        )",',
              '              "        self.chauffage_predictif_horizon_operationnel_jours = max(",',
              '              "            1,",',
              '              "            min(",',
              '              "                7,",',
              '              "                int(",',
              '              "                    float(",',
              '              "                        self.args.get(",',
              '              "                            \\\"chauffage_predictif_horizon_operationnel_jours\\\",",',
              '              "                            3,",',
              '              "                        )",',
              '              "                    )",',
              '              "                ),",',
              '              "            ),",',
              '              "        )",',
              '          ]',
              '          new_block = "\\n".join(block_lines) + "\\n"',
              '          Path(runtime).write_text(runtime_text[:start] + new_block + runtime_text[end:])',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit preparer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prepare-v0.6.1.yml
          git commit -m "fix: v0.6.1 preparer runtime patch"
          git push origin HEAD:main

      - name: Remove fixer
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-v0.6.1-preparer.yml
          git commit -m "chore: remove v0.6.1 preparer fixer"
          git push origin HEAD:main
