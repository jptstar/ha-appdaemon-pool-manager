name: Publish v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "v0.3.0 already exists"
            exit 0
          fi
          gh release create v0.3.0 \
            --target 7758dddba03bc379c82bad2ecb2aa4285a09c61c \
            --title "v0.3.0 - PAC automation and fail-safe safety layer" \
            --notes-file - <<'EOF'
          ## Pool Manager v0.3.0

          This release adds a dedicated safety layer for PAC sequencing, adaptive freeze protection and unavailable-entity fail-safe behavior.

          ### PAC automation
          - Optional automatic seasonal PAC management using the existing 08:00–20:00 policy and warm/cold thresholds.
          - Safe start sequence: **pump ON → minimum circulation confirmed → PAC Heat**.
          - Automatic start is aborted if minimum pump circulation cannot be confirmed within the configured timeout.
          - Normal stop sequence: **PAC Off → post-circulation → normal filtration strategy**.
          - The existing temporary heating override remains a separate supported policy boundary.

          ### Freeze protection
          - Optional adaptive freeze mode with hysteresis.
          - Default continuous protection starts at/below **1 °C** and releases only above **3 °C**.
          - A real low-temperature condition can protect the pool even if the Home Assistant mode-selection automation failed to switch to `Hors Gel`.
          - If the outdoor sensor becomes unavailable while already in `Hors Gel`, Pool Manager falls back to continuous safe circulation.

          ### Fail-safe behavior
          - An unavailable water-temperature sensor no longer silently becomes 10 °C: memory → last valid value → conservative configurable fallback.
          - An unavailable PAC climate entity blocks a new automatic PAC start.
          - If PAC power proves the unit is running but pump circulation is not confirmed, Pool Manager tries to restore circulation and can stop the PAC after a bounded timeout.
          - Fail-safe changes are logged to `piscine_log` without adding another Home Assistant helper.

          `gestion_pac_auto` and `hors_gel_adaptatif` are **disabled by default** for safe migration. Configure and validate them before disabling the existing Home Assistant seasonal PAC automation.
          EOF
